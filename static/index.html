<!doctype html>

<html ng-app="app">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.0/angular.min.js"></script>
    <script src="index.js"></script>
</head>

<body>

<div class="container" ng-controller="indexController">
    <h1>Читательский дневник</h1>
    <img src="books.png">
    <h3>Список книг</h3>
    <table class="table table-hover" cellpadding="0" cellspacing="0">
        <tr>
            <td>Автор</td>
            <td>Название</td>
            <td>Количество страниц</td>
            <td>Описание</td>
            <td>Формат</td>
            <td>Статус</td>
            <td>Рейтинг</td>
            <td>Заметки</td>
            <td></td>
            <td></td>
        </tr>
        <tbody>
        <tr ng-repeat="p in BooksList">
            <td>{{p.author}}</td>
            <td>{{p.title}}</td>
            <td>{{p.pages}}</td>
            <td>{{p.description}}</td>
            <td>{{p.format}}</td>
            <td>{{p.status}}</td>
            <td>{{p.rating}}</td>
            <td>{{p.note}}</td>
            <td>
                <button class="btn btn-danger" ng-click="deleteBookById(p.id)">Удалить книгу</button>
            </td>
            <td>
                <button class="btn btn-danger" ng-click="updateBookById(p.id)">Изменить книгу</button>
            </td>
        </tr>
        </tbody>
    </table>
    <table>
        <tr>
            <td>
                <h3>Добавить книгу</h3>
                <form novalidate ng-submit="submitCreateNewBook()">
                    <div class="form-group col-md-6">
                        <label for="newBookAuthor">Автор</label>
                        <input class="form-control" type="text" ng-model="newBook.author" id="newBookAuthor">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="newBookTitle">Название</label>
                        <input class="form-control" type="text" ng-model="newBook.title" id="newBookTitle">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="newBookPage">Количество страниц</label>
                        <input class="form-control" type="number" ng-model="newBook.pages" id="newBookPage">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="newBookDesc">Описание</label>
                        <input class="form-control" type="text" ng-model="newBook.description" id="newBookDesc">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="newBookFormat">Формат книги (1 - аудиокнига, 2 - бумажная, 3 - электронная)</label>
                        <input class="form-control" type="number" ng-model="newBook.format" id="newBookFormat">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="newBookStatus">Статус книги (1 - прочитано, 2 - буду читать, 3 - отложено, 4 - читаю
                            сейчас)</label>
                        <input class="form-control" type="number" ng-model="newBook.status" id="newBookStatus">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="newBookRating">Рейтинг книги (0-10)</label>
                        <input class="form-control" type="number" ng-model="newBook.rating" id="newBookRating">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="newBookNote">Заметки</label>
                        <input class="form-control" type="text" ng-model="newBook.note" id="newBookNote">
                    </div>
                    <div>
                        <button class="btn btn-success" type="submit">Сохранить</button>
                    </div>
                </form>
            </td>
            <td>
                <h3>Изменить книгу</h3>
                <form novalidate ng-submit="updateBookById("+updateBook.id+")">
                    <div class="form-group col-md-6">
                        <label for="updateBookAuthor">Автор</label>
                        <input class="form-control" type="text" ng-model="updateBook.author" id="updateBookAuthor"  value="updateBook.author">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="updateBookTitle">Название</label>
                        <input class="form-control" type="text" ng-model="updateBook.title" id="updateBookTitle"  value="updateBook.title">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="updateBookPage">Количество страниц</label>
                        <input class="form-control" type="number" ng-model="updateBook.pages" id="updateBookPage"  value="updateBook.pages">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="updateBookDesc">Описание</label>
                        <input class="form-control" type="text" ng-model="updateBook.description" id="updateBookDesc"  value="updateBook.description">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="updateBookFormat">Формат книги (1 - аудиокнига, 2 - бумажная, 3 - электронная)</label>
                        <input class="form-control" type="number" ng-model="updateBook.format" id="updateBookFormat"  value="updateBook.format">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="updateBookStatus">Статус книги (1 - прочитано, 2 - буду читать, 3 - отложено, 4 - читаю
                            сейчас)</label>
                        <input class="form-control" type="number" ng-model="updateBook.status" id="updateBookStatus"  value="updateBook.status">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="updateBookRating">Рейтинг книги (0-10)</label>
                        <input class="form-control" type="number" ng-model="updateBook.rating" id="updateBookRating"  value="updateBook.rating">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="updateBookNote">Заметки</label>
                        <input class="form-control" type="text" ng-model="updateBook.note" id="updateBookNote" value="updateBook.note">
                    </div>
                    <div>
                        <button class="btn btn-success" type="submit" ng-click="saveBookById(updateBook.id)">Сохранить</button>
                    </div>
                </form>
            </td>
            >
        </tr>
    </table>
    >
</div>
</body>
</html>
